<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Subbulakshmi Natarajan — Business Analyst, Data Analyst and Healthcare AI professional</title>
  <desc id="desc">Animated professional banner highlighting Business Analysis, Power BI, Microsoft Fabric and Healthcare AI.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#0f3151"/>
      <stop offset="1" stop-color="#0e7490"/>
      <animate attributeName="x1" values="0;0.18;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0.78;1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="380" rx="28"/>
    </clipPath>
  </defs>

  <style>
    .font { font-family: Inter, Segoe UI, Arial, sans-serif; }
    .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 3.5px; }
    .name { font-size: 45px; font-weight: 800; letter-spacing: -0.8px; }
    .role { font-size: 21px; font-weight: 700; letter-spacing: 0.4px; }
    .tagline { font-size: 17px; font-weight: 500; }
    .chip { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
    .status { font-size: 12px; font-weight: 800; letter-spacing: 1px; }
    .node-label { font-size: 12px; font-weight: 700; }
    .float-a { animation: floatA 5s ease-in-out infinite; transform-origin: center; }
    .float-b { animation: floatB 6.5s ease-in-out infinite; transform-origin: center; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; }
    .dash { stroke-dasharray: 8 10; animation: dash 9s linear infinite; }
    .scan { animation: scan 6s ease-in-out infinite; }
    @keyframes floatA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes floatB { 0%,100% { transform: translateY(0); } 50% { transform: translateY(12px); } }
    @keyframes pulse { 0%,100% { opacity: .62; transform: scale(1); } 50% { opacity: 1; transform: scale(1.07); } }
    @keyframes dash { to { stroke-dashoffset: -180; } }
    @keyframes scan { 0%,16% { transform: translateX(-500px); opacity: 0; } 28%,58% { opacity: .55; } 72%,100% { transform: translateX(1200px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .float-a, .float-b, .pulse, .dash, .scan { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#background)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle cx="1090" cy="30" r="165" fill="#38bdf8" opacity="0.06" class="float-b"/>
    <circle cx="1015" cy="330" r="135" fill="#a78bfa" opacity="0.07" class="float-a"/>
    <circle cx="85" cy="365" r="115" fill="#22d3ee" opacity="0.05" class="float-b"/>
    <rect x="-520" y="0" width="400" height="380" fill="url(#scan)" class="scan"/>

    <rect x="70" y="44" width="246" height="30" rx="15" fill="#ffffff" fill-opacity="0.09" stroke="#67e8f9" stroke-opacity="0.45"/>
    <circle cx="89" cy="59" r="5" fill="#4ade80" class="pulse"/>
    <text x="103" y="64" fill="#d5fbff" class="font status">OPEN TO OPPORTUNITIES</text>

    <text x="70" y="112" fill="#67e8f9" class="font eyebrow">HELLO, I’M</text>
    <text x="70" y="164" fill="#ffffff" class="font name">Subbulakshmi Natarajan</text>
    <rect x="70" y="179" width="512" height="4" rx="2" fill="url(#accent)"/>
    <text x="70" y="220" fill="#dbeafe" class="font role">BUSINESS ANALYST  •  DATA ANALYST  •  HEALTHCARE AI</text>
    <text x="70" y="255" fill="#cbd5e1" class="font tagline">Turning complex needs into clear requirements, optimised processes</text>
    <text x="70" y="280" fill="#cbd5e1" class="font tagline">and decision-ready Power BI insights.</text>

    <g transform="translate(70 311)">
      <rect width="112" height="34" rx="17" fill="#facc15"/>
      <text x="56" y="22" text-anchor="middle" fill="#111827" class="font chip">POWER BI</text>
      <rect x="124" width="154" height="34" rx="17" fill="#0b2239" stroke="#60a5fa" stroke-opacity="0.8"/>
      <text x="201" y="22" text-anchor="middle" fill="#dbeafe" class="font chip">MS FABRIC</text>
      <rect x="290" width="142" height="34" rx="17" fill="#0b2239" stroke="#a78bfa" stroke-opacity="0.8"/>
      <text x="361" y="22" text-anchor="middle" fill="#ede9fe" class="font chip">IIBA ECBA</text>
      <rect x="444" width="178" height="34" rx="17" fill="#0b2239" stroke="#22d3ee" stroke-opacity="0.8"/>
      <text x="533" y="22" text-anchor="middle" fill="#cffafe" class="font chip">RESPONSIBLE AI</text>
    </g>

    <g transform="translate(780 86)">
      <path d="M88 82 C150 30 236 26 302 72 M84 92 C146 146 240 151 310 104 M192 80 C164 130 164 190 194 232 M202 81 C238 132 238 184 201 230" fill="none" stroke="#7dd3fc" stroke-opacity="0.5" stroke-width="2" class="dash"/>

      <g class="float-a">
        <circle cx="86" cy="86" r="54" fill="#0b2239" stroke="#22d3ee" stroke-width="2" filter="url(#softGlow)"/>
        <circle cx="86" cy="70" r="14" fill="#22d3ee" opacity="0.22"/>
        <text x="86" y="91" text-anchor="middle" fill="#ffffff" class="font node-label">BUSINESS</text>
        <text x="86" y="108" text-anchor="middle" fill="#a5f3fc" class="font node-label">ANALYSIS</text>
      </g>

      <g class="float-b">
        <circle cx="309" cy="88" r="54" fill="#0b2239" stroke="#60a5fa" stroke-width="2" filter="url(#softGlow)"/>
        <circle cx="309" cy="70" r="14" fill="#60a5fa" opacity="0.22"/>
        <text x="309" y="91" text-anchor="middle" fill="#ffffff" class="font node-label">DATA &amp;</text>
        <text x="309" y="108" text-anchor="middle" fill="#bfdbfe" class="font node-label">POWER BI</text>
      </g>

      <g class="pulse">
        <circle cx="197" cy="230" r="58" fill="#0b2239" stroke="#a78bfa" stroke-width="2" filter="url(#softGlow)"/>
        <circle cx="197" cy="209" r="14" fill="#a78bfa" opacity="0.22"/>
        <text x="197" y="230" text-anchor="middle" fill="#ffffff" class="font node-label">HEALTHCARE</text>
        <text x="197" y="248" text-anchor="middle" fill="#ddd6fe" class="font node-label">AI</text>
      </g>

      <circle cx="197" cy="97" r="11" fill="#ffffff" opacity="0.9"/>
      <circle cx="197" cy="97" r="22" fill="none" stroke="#ffffff" stroke-opacity="0.32" class="pulse"/>
    </g>
  </g>
</svg>
